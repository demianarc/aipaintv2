<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0e0e10">
  <title>{% block title %}The AI Museum{% endblock %}</title>
  <meta name="description" content="A daily encounter with a painting from the Harvard Art Museums, interpreted by AI.">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body>
  {% set page = page|default('') %}
  <nav class="nav">
    <a href="{{ url_for('landing_page') }}" class="nav-brand">
      <span class="nav-brand-mark"></span>
      <span>The AI Museum</span>
    </a>
    <div class="nav-links">
      <a href="{{ url_for('museum') }}" class="nav-link {% if page == 'museum' %}is-active{% endif %}">Museum</a>
      <a href="{{ url_for('favorites') }}" class="nav-link {% if page == 'favorites' %}is-active{% endif %}">Favorites</a>
      <a href="{{ url_for('about') }}" class="nav-link {% if page == 'about' %}is-active{% endif %}">About</a>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle theme"></button>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <div class="modal" data-modal>
    <button type="button" class="modal-close" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <img class="modal-image" alt="">
  </div>

  <div class="toast-container"></div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
