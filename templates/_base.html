<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)">
  <title>{% block title %}The AI Museum — masterpieces decoded by an AI art historian{% endblock %}</title>
  <meta name="description" content="{% block description %}A daily encounter with a painting from the world's great collections, interpreted by AI. Stream-written commentary, audio narration, and a quiz — free, no account.{% endblock %}">
  <meta name="keywords" content="AI art, art history, museum, paintings, art interpretation, The Met, art education, AI museum, online museum, art appreciation">
  <meta name="author" content="Dylan Bristot">
  <link rel="canonical" href="{% block canonical %}https://theaimuseum.com{{ request.path }}{% endblock %}">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{% block og_title %}The AI Museum — masterpieces decoded{% endblock %}">
  <meta property="og:description" content="{% block og_description %}A painting a day, read aloud by an AI art historian. Free, no account.{% endblock %}">
  <meta property="og:image" content="{% block og_image %}https://images.metmuseum.org/CRDImages/ep/web-large/DP-42549-001.jpg{% endblock %}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% block tw_title %}The AI Museum{% endblock %}">
  <meta name="twitter:description" content="A painting a day, read aloud by AI.">

  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.metmuseum.org" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "The AI Museum",
    "url": "https://theaimuseum.com",
    "description": "A daily encounter with a painting, interpreted by AI.",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://theaimuseum.com/app?id={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  {% block head_extra %}{% endblock %}
</head>
<body>
  {% set page = page|default('') %}
  <div class="scroll-progress" data-scroll-progress aria-hidden="true"></div>

  <nav class="nav">
    <a href="{{ url_for('landing_page') }}" class="nav-brand" aria-label="The AI Museum — home">
      <span class="nav-brand-mark"></span>
      <span>The AI Museum</span>
    </a>
    <div class="nav-links">
      <a href="{{ url_for('museum') }}" class="nav-link {% if page == 'museum' %}is-active{% endif %}">Museum</a>
      <a href="{{ url_for('quiz_page') }}" class="nav-link {% if page == 'quiz' %}is-active{% endif %}">Quiz</a>
      <a href="{{ url_for('favorites') }}" class="nav-link {% if page == 'favorites' %}is-active{% endif %}">Favorites</a>
      <a href="{{ url_for('about') }}" class="nav-link {% if page == 'about' %}is-active{% endif %}">About</a>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle theme"></button>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <div class="modal" data-modal>
    <button type="button" class="modal-close" aria-label="Close">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <img class="modal-image" alt="">
  </div>

  <div class="toast-container"></div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
