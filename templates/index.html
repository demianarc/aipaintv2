{% extends "_base.html" %}
{% set page = 'museum' %}
{% block title %}Museum — The AI Museum{% endblock %}

{% block content %}
<main class="museum">
  <div class="error-banner" data-error style="display: none;"></div>

  <form class="filter-bar" data-filter-bar onsubmit="event.preventDefault();">
    <div class="filter-group">
      <label for="filter-movement">Movement</label>
      <select id="filter-movement" name="movement" data-filter>
        <option value="">Any</option>
        {% for m in filter_options.movements %}<option value="{{ m }}">{{ m }}</option>{% endfor %}
      </select>
    </div>
    <div class="filter-group">
      <label for="filter-century">Century</label>
      <select id="filter-century" name="century" data-filter>
        <option value="">Any</option>
        {% for c in filter_options.centuries %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
      </select>
    </div>
    <div class="filter-group">
      <label for="filter-culture">Culture</label>
      <select id="filter-culture" name="culture" data-filter>
        <option value="">Any</option>
        {% for c in filter_options.cultures %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
      </select>
    </div>
    <div class="filter-group">
      <label for="filter-medium">Medium</label>
      <select id="filter-medium" name="medium" data-filter>
        <option value="">Any</option>
        {% for m in filter_options.mediums %}<option value="{{ m }}">{{ m }}</option>{% endfor %}
      </select>
    </div>
    <button type="button" class="filter-clear" data-filter-clear>Clear</button>
  </form>

  <article class="artwork" data-museum>
    <div class="artwork-image-wrap is-loading" data-image-wrap>
      <img class="artwork-image" data-image alt="">
    </div>

    <div class="artwork-text">
      <div class="artwork-meta">
        <p class="artwork-eyebrow">From the collection</p>
        <h1 class="artwork-title" data-title>Loading…</h1>
        <p class="artwork-byline" data-byline></p>
        <div class="artwork-divider"></div>
      </div>

      <blockquote class="pull-quote" data-pull-quote hidden></blockquote>

      <div class="artwork-interpretation has-dropcap" data-interpretation>
        <span class="skeleton"></span>
        <span class="skeleton"></span>
        <span class="skeleton"></span>
        <span class="skeleton"></span>
        <span class="skeleton"></span>
      </div>

      <div class="artwork-tags" data-tags></div>

      <div class="artwork-actions">
        <button type="button" class="action" data-fav-btn aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>
          <span class="action-label">Save</span>
        </button>
        <button type="button" class="action" data-listen-btn aria-label="Listen to interpretation" disabled>
          <span class="action-icon" data-listen-icon><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg></span>
          <span class="action-label" data-listen-label>Listen</span>
        </button>
        <button type="button" class="action is-primary" data-next-btn>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <span>Next artwork</span>
        </button>
        <button type="button" class="action" data-share-btn>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/></svg>
          <span>Share</span>
        </button>
        <a class="action" data-source-btn target="_blank" rel="noopener noreferrer" style="display: none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg>
          <span>The Met</span>
        </a>
      </div>
    </div>
  </article>
</main>
{% endblock %}

{% block scripts %}
<script>
  window.__INITIAL_ID__ = {{ initial_id|tojson if initial_id else 'null' }};
</script>
{% endblock %}
